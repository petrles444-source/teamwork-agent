# teamwork-agent — непрерывная проверка.
#
# Смысл этого файла: каждый инцидент в исходном проекте свёлся к тому, что
# красный гейт или непроверенное число никто не заметил. Здесь гейты
# запускаются автоматически при каждом коммите, а не по памяти агента.
#
# Джоба одна, а не две. Медленные гейты не выносятся в отдельную джобу с
# continue-on-error: разница в полторы минуты не оправдывает ни отдельного
# окружения, ни флага, который тихо прятал бы настоящие падения.
#
# Что установлено: только dev-зависимости шаблона (pytest, ruff). Дашборд в CI
# не нужен — он read-only и для проверки кода ничего не добавляет.

name: gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Падение гейта в этой ветке отменяет текущий прогон; на остальных — нет,
# чтобы чужое красное не блокировало работу тех, кто его не вызывал.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: все гейты
        run: python scripts/dev.py gates

      - name: целостность coordination-файлов
        # Отдельный шаг с явным кодом возврата: validate — самый дешёвый
        # гейт, и именно он ловит битый JSON, в который агент пишет каждый
        # день. Отдельный шаг нужен, чтобы его падение было видно в списке
        # шагов CI, а не пряталось внутри сводки dev.py.
        run: python scripts/agent_handoff.py validate

      - name: сводка при падении
        # Сводка печатается раннером, но при падении уходит в stderr, а
        # stderr в логах GitHub теряется среди трейсов подпроцессов.
        # Ключевая строка дублируется в конец лога.
        if: failure()
        run: |
          echo "::error::Гейты красные. Подробности выше; сводка — в выводе 'python scripts/dev.py gates'"
          python scripts/agent_handoff.py health-check || true
